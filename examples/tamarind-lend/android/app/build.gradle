plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'example.tamarind'
    compileSdk 35

    defaultConfig {
        applicationId 'example.tamarind'
        minSdk 26
        targetSdk 35
        versionCode 412
        versionName '4.12.0'

        buildConfigField 'String', 'API_BASE', '"https://api.tamarind.example"'
        buildConfigField 'String', 'VERILANE_BASE', '"https://api.verilane.example/v2"'
        buildConfigField 'String', 'VERILANE_API_KEY', '"vl_live_FAKE0000000000000000EXAMPLE"'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'

    // Device risk signals for fraud checks at signup and disbursal
    implementation 'example.signalgrid:device-sdk:4.2.0'
    // Screen analytics and crash reports
    implementation 'example.pulsemetric:analytics:2.8.1'
}
